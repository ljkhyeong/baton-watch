import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'base'
    id 'org.springframework.boot' version '4.1.1' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.personal.baton.watch'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

// 통합 테스트 PostgreSQL 이미지는 Dockerfile postgres 단계의 고정값 하나를 따른다.
def postgresTestImage = providers.fileContents(layout.projectDirectory.file('Dockerfile')).asText.map { text ->
    def matcher = text =~ /(?m)^FROM\s+(\S+)\s+AS\s+postgres\s*$/
    if (!matcher.find()) {
        throw new GradleException('Dockerfile에서 postgres 단계 이미지를 찾지 못했습니다.')
    }
    matcher.group(1)
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    ext['tomcat.version'] = '11.0.25'
    ext['jackson-bom.version'] = '3.1.7'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencyManagement {
        imports {
            mavenBom SpringBootPlugin.BOM_COORDINATES
        }
        dependencies {
            dependency 'org.apache.httpcomponents.client5:httpclient5:5.6.4'
            dependency 'org.apache.httpcomponents.core5:httpcore5:5.4.3'
            dependency 'org.apache.httpcomponents.core5:httpcore5-h2:5.4.3'
            dependency 'org.flywaydb:flyway-core:13.4.0'
            dependency 'org.flywaydb:flyway-database-postgresql:13.4.0'
            dependency 'org.postgresql:postgresql:42.7.13'
        }
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.add('-parameters')
    }

    tasks.withType(Test).configureEach {
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform()
        systemProperty 'watch.test.postgres-image', postgresTestImage.get()
    }
}
