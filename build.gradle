import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'base'
    id 'org.springframework.boot' version '4.1.0' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.personal.baton.watch'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencyManagement {
        imports {
            mavenBom SpringBootPlugin.BOM_COORDINATES
            mavenBom 'tools.jackson:jackson-bom:3.2.2'
        }
        dependencies {
            dependency 'org.apache.httpcomponents.client5:httpclient5:5.6.3'
            dependency 'org.apache.httpcomponents.core5:httpcore5:5.4.3'
            dependency 'org.apache.httpcomponents.core5:httpcore5-h2:5.4.3'
            dependency 'org.flywaydb:flyway-core:12.11.0'
            dependency 'org.flywaydb:flyway-database-postgresql:12.11.0'
            dependency 'org.postgresql:postgresql:42.7.12'
        }
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.add('-parameters')
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

tasks.named('assemble') {
    dependsOn ':bootstrap:bootJar'
}

tasks.named('check') {
    dependsOn subprojects.collect { it.tasks.named('test') }
}
