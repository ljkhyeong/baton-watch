services:
  watch-gateway:
    image: nginx:1.31.0-alpine-slim@sha256:241b0d0fe06250e026e7a35a008d022c9a1d3bec19442d65cc33b84d0b5dd64d
    # 인그레스 서비스에 읽기 전용 루트·권한 제거·로그 제한을 같은 값으로 적용한다.
    <<: &hardened-edge-service
      read_only: true
      cap_drop:
        - ALL
      security_opt:
        - no-new-privileges:true
      logging:
        driver: json-file
        options:
          max-size: "10m"
          max-file: "3"
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    volumes:
      - type: bind
        source: ./ops/nginx/watch-gateway.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      watch:
        condition: service_healthy
        restart: true
    networks:
      - watch-edge
      - watch-ingress
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101
    pids_limit: 32
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 64M
          pids: 32

  cloudflared:
    image: cloudflare/cloudflared:2026.10.6@sha256:004d843fa5fdc3103983fd580ee19fab4a8fa98add31f87249c1659e848c98e0
    <<: *hardened-edge-service
    user: "65532:65532"
    # 이미지 기본 진입점에는 없는 자동 갱신 차단을 명령행으로 고정한다.
    entrypoint: ["cloudflared", "--no-autoupdate"]
    command:
      - tunnel
      - --loglevel
      - info
      - --metrics
      - 127.0.0.1:2000
      - run
      - --token-file
      - /run/secrets/cloudflare-tunnel-token
    secrets:
      - source: cloudflare-tunnel-token
        target: cloudflare-tunnel-token
    depends_on:
      watch-gateway:
        condition: service_healthy
        restart: true
    networks:
      - watch-ingress
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 40s
    init: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    pids_limit: 128
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 256M
          pids: 128

networks:
  watch-ingress:

secrets:
  cloudflare-tunnel-token:
    file: "${WATCH_TUNNEL_TOKEN_FILE:?WATCH_TUNNEL_TOKEN_FILE is required}"
