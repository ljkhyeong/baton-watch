dependencies {
    implementation project(':application')
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'

    runtimeOnly('org.flywaydb:flyway-database-postgresql') {
        exclude group: 'org.flywaydb', module: 'flyway-database-cockroachdb'
    }
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework:spring-test'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.awaitility:awaitility'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'tools.jackson.core:jackson-databind'
}

tasks.named('test', Test) {
    useJUnitPlatform { excludeTags 'load', 'process-recovery' }
    // 테스트가 별도 프로세스에서 읽는 운영 파일도 변경 감지에 포함한다.
    inputs.files(rootProject.files(
        'ops/staging-monitor-diagnostics.sh',
        'ops/monitor-diagnostics.sql',
        'ops/staging-database-backup.sh',
        'ops/compose.restore-test.yml',
        'ops/verify-restored-database.sql'
    )).withPropertyName('databaseTooling').withPathSensitivity(PathSensitivity.RELATIVE)
}

tasks.register('processRecoveryTest', Test) {
    description = '격리 PostgreSQL과 별도 JVM에서 강제 종료 후 리스·이벤트 복구를 확인한다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'process-recovery' }
    systemProperty 'watch.recovery.classpath', sourceSets.test.runtimeClasspath.asPath
    outputs.upToDateWhen { false }
}

tasks.register('loadTest', Test) {
    description = '격리 PostgreSQL에서 동기화·점검·전달 부하와 장애 복구를 확인한다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'load' }
    systemProperty 'watch.load.monitors', providers.gradleProperty('watchLoadMonitors').getOrElse('100')
    testLogging.showStandardStreams = true
    outputs.upToDateWhen { false }
}
