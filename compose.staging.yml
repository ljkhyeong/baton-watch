name: "${WATCH_COMPOSE_PROJECT_NAME:-baton-watch-staging}"

services:
  postgres:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: "${WATCH_DB_NAME:-baton_watch}"
      POSTGRES_USER: "${WATCH_DB_OWNER_USER:-baton_watch_owner}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-owner-password
    secrets:
      - source: watch-db-owner-password
        target: postgres-owner-password
    volumes:
      - watch-postgres-data:/var/lib/postgresql
    networks:
      - watch-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /var/run/postgresql:rw,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    deploy:
      resources:
        limits:
          cpus: 1.0
          memory: 768M
          pids: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  database-role-init:
    image: "baton-watch-database-operations:${WATCH_IMAGE_REVISION:?WATCH_IMAGE_REVISION must be the full Git SHA}"
    pull_policy: never
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: "${WATCH_DB_NAME:-baton_watch}"
      PGUSER: "${WATCH_DB_OWNER_USER:-baton_watch_owner}"
      WATCH_DB_RUNTIME_USER: "${WATCH_DB_RUNTIME_USER:-baton_watch_runtime}"
    secrets:
      - source: watch-db-owner-password
        target: postgres-owner-password
      - source: watch-db-runtime-password
        target: postgres-runtime-password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - watch-db
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=4m,uid=70,gid=0,mode=0730
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 128M
          pids: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    image: "baton-watch-migrations:${WATCH_IMAGE_REVISION:?WATCH_IMAGE_REVISION must be the full Git SHA}"
    pull_policy: never
    environment:
      HOME: /tmp
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: "${WATCH_DB_NAME:-baton_watch}"
      PGUSER: "${WATCH_DB_OWNER_USER:-baton_watch_owner}"
      WATCH_DB_RUNTIME_USER: "${WATCH_DB_RUNTIME_USER:-baton_watch_runtime}"
    secrets:
      - source: watch-db-owner-password
        target: postgres-owner-password
    depends_on:
      database-role-init:
        condition: service_completed_successfully
    networks:
      - watch-db
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=65532,gid=0,mode=0730
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 384M
          pids: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  watch:
    image: "baton-watch:${WATCH_IMAGE_REVISION:?WATCH_IMAGE_REVISION must be the full Git SHA}"
    pull_policy: never
    user: "0:0"
    entrypoint: ["/opt/watch/run-as-watch-user.sh"]
    command: ["java", "-jar", "/app/baton-watch.jar"]
    environment:
      JAVA_TOOL_OPTIONS: "${WATCH_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8}"
      SPRING_CONFIG_IMPORT: configtree:/run/watch-secrets/
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${WATCH_DB_NAME:-baton_watch}"
      SPRING_DATASOURCE_USERNAME: "${WATCH_DB_RUNTIME_USER:-baton_watch_runtime}"
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 30s
      MANAGEMENT_SERVER_ADDRESS: 127.0.0.1
      WATCH_DB_MAXIMUM_POOL_SIZE: "${WATCH_DB_MAXIMUM_POOL_SIZE:-8}"
      WATCH_DB_MINIMUM_IDLE: "${WATCH_DB_MINIMUM_IDLE:-2}"
      WATCH_DB_CONNECTION_TIMEOUT_MILLIS: "${WATCH_DB_CONNECTION_TIMEOUT_MILLIS:-3000}"
      WATCH_DB_VALIDATION_TIMEOUT_MILLIS: "${WATCH_DB_VALIDATION_TIMEOUT_MILLIS:-1000}"
      WATCH_DB_IDLE_TIMEOUT_MILLIS: "${WATCH_DB_IDLE_TIMEOUT_MILLIS:-600000}"
      WATCH_DB_MAX_LIFETIME_MILLIS: "${WATCH_DB_MAX_LIFETIME_MILLIS:-1800000}"
      WATCH_DB_KEEPALIVE_TIME_MILLIS: "${WATCH_DB_KEEPALIVE_TIME_MILLIS:-120000}"
      WATCH_DB_INITIALIZATION_FAIL_TIMEOUT_MILLIS: "${WATCH_DB_INITIALIZATION_FAIL_TIMEOUT_MILLIS:-5000}"
      WATCH_DB_CONNECT_TIMEOUT_SECONDS: "${WATCH_DB_CONNECT_TIMEOUT_SECONDS:-3}"
      WATCH_DB_LOGIN_TIMEOUT_SECONDS: "${WATCH_DB_LOGIN_TIMEOUT_SECONDS:-5}"
      WATCH_DB_SOCKET_TIMEOUT_SECONDS: "${WATCH_DB_SOCKET_TIMEOUT_SECONDS:-10}"
      WATCH_DB_CANCEL_SIGNAL_TIMEOUT_SECONDS: "${WATCH_DB_CANCEL_SIGNAL_TIMEOUT_SECONDS:-3}"
      WATCH_DB_TCP_KEEP_ALIVE: "${WATCH_DB_TCP_KEEP_ALIVE:-true}"
      WATCH_PERSISTENCE_QUERY_TIMEOUT: "${WATCH_PERSISTENCE_QUERY_TIMEOUT:-5s}"
      WATCH_PERSISTENCE_TRANSACTION_TIMEOUT: "${WATCH_PERSISTENCE_TRANSACTION_TIMEOUT:-5s}"
      WATCH_PERSISTENCE_LOCK_TIMEOUT: "${WATCH_PERSISTENCE_LOCK_TIMEOUT:-1s}"
      WATCH_WORKER_EXECUTION_BUDGET: "${WATCH_WORKER_EXECUTION_BUDGET:-60s}"
      WATCH_EVENT_DELIVERY_ENABLED: "false"
      WATCH_CHECK_ENABLED: "${WATCH_CHECK_ENABLED:-true}"
    secrets:
      - source: watch-db-runtime-password
        target: spring.datasource.password
      - source: watch-api-token
        target: watch.api-token
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      migrate:
        condition: service_completed_successfully
    networks:
      - watch-db
      - watch-edge
    healthcheck:
      test: ["CMD", "su-exec", "10001:10001", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 110s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /run/watch-secrets:rw,noexec,nosuid,nodev,size=1m,uid=0,gid=0,mode=0700
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    deploy:
      resources:
        limits:
          cpus: 1.0
          memory: 768M
          pids: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  watch-db:
    driver: bridge
    internal: true
  watch-edge:
    driver: bridge
    internal: false

volumes:
  watch-postgres-data:
    external: true
    name: "${WATCH_POSTGRES_VOLUME_NAME:?WATCH_POSTGRES_VOLUME_NAME is required}"

secrets:
  watch-db-owner-password:
    file: "${WATCH_DB_OWNER_PASSWORD_FILE:?WATCH_DB_OWNER_PASSWORD_FILE is required}"
  watch-db-runtime-password:
    file: "${WATCH_DB_RUNTIME_PASSWORD_FILE:?WATCH_DB_RUNTIME_PASSWORD_FILE is required}"
  watch-api-token:
    file: "${WATCH_API_TOKEN_FILE:?WATCH_API_TOKEN_FILE is required}"
