rule_files:
  - watch-ingress-alerts.yml
evaluation_interval: 1m
tests:
  - name: WATCH 수집과 프록시 생존이 정상이어도 요청 실패를 감지하고 복구하면 해제
    interval: 1m
    input_series:
      - series: up{job="baton-watch",instance="watch"}
        values: '1x15'
      - series: up{job="baton-watch-ingress",instance="watch-gateway",route="gateway"}
        values: '1x15'
      - series: up{job="baton-watch-ingress",instance="watch-public",route="public"}
        values: '1x15'
      - series: probe_success{job="baton-watch-ingress",instance="watch-gateway",route="gateway"}
        values: '1x2 0x4 1x8'
      - series: probe_success{job="baton-watch-ingress",instance="watch-public",route="public"}
        values: '1x15'
    alert_rule_test:
      - eval_time: 4m
        alertname: WatchIngressRequestFailed
        exp_alerts: []
      - eval_time: 5m
        alertname: WatchIngressRequestFailed
        exp_alerts:
          - exp_labels: {job: baton-watch-ingress, instance: watch-gateway, route: gateway, severity: critical}
            exp_annotations: {summary: WATCH 인바운드 요청 경로 실패}
    promql_expr_test:
      - expr: ALERTS{alertstate="firing"}
        eval_time: 10m
        exp_samples: []
  - name: Exporter 수집 실패와 성공 지표 누락을 요청 실패와 구분
    interval: 1m
    input_series:
      - series: up{job="baton-watch-ingress",instance="watch-gateway",route="gateway"}
        values: '0x10'
      - series: probe_success{job="baton-watch-ingress",instance="watch-gateway",route="gateway"}
        values: '0x10'
      - series: up{job="baton-watch-ingress",instance="watch-public",route="public"}
        values: '1x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: WatchIngressProbeUnavailable
        exp_alerts:
          - exp_labels: {job: baton-watch-ingress, instance: watch-gateway, route: gateway, severity: warning}
            exp_annotations: {summary: WATCH 인바운드 점검 결과 수집 실패}
          - exp_labels: {job: baton-watch-ingress, instance: watch-public, route: public, severity: warning}
            exp_annotations: {summary: WATCH 인바운드 점검 결과 수집 실패}
      - eval_time: 2m
        alertname: WatchIngressRequestFailed
        exp_alerts: []
  - name: 다른 경로가 정상이어도 공개 경로 설정 누락 감지
    interval: 1m
    input_series:
      - series: up{job="baton-watch-ingress",instance="watch-gateway",route="gateway"}
        values: '1x10'
      - series: probe_success{job="baton-watch-ingress",instance="watch-gateway",route="gateway"}
        values: '1x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: WatchIngressTargetMissing
        exp_alerts: []
      - eval_time: 5m
        alertname: WatchIngressTargetMissing
        exp_alerts:
          - exp_labels: {job: baton-watch-ingress, route: public, severity: warning}
            exp_annotations: {summary: WATCH 인바운드 점검 대상 누락}
  - name: 수집 작업 전체 누락 감지
    input_series: []
    alert_rule_test:
      - eval_time: 5m
        alertname: WatchIngressTargetMissing
        exp_alerts:
          - exp_labels: {job: baton-watch-ingress, route: gateway, severity: warning}
            exp_annotations: {summary: WATCH 인바운드 점검 대상 누락}
          - exp_labels: {job: baton-watch-ingress, route: public, severity: warning}
            exp_annotations: {summary: WATCH 인바운드 점검 대상 누락}
