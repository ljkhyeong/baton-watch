# 외부 연결 없이 프록시의 상태·인증 헤더·본문 전달을 검사하는 HTTP 대역이다.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 0;
    server {
        listen 8080;
        location = /api/v1/system/status { return 200 '{"status":"UP"}'; }
        location /api/v1/ {
            add_header X-Test-Authorization $http_authorization always;
            add_header X-Test-Length $http_content_length always;
            return 401 '{"code":"UNAUTHORIZED"}';
        }
    }
    server {
        listen 127.0.0.1:8082;
        location = /health { return 204; }
    }
}
