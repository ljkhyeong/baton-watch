services:
  watch:
    extends:
      file: ../../compose.staging-tunnel.yml
      service: watch-gateway
    depends_on: !reset {}
    volumes: !override
      - ./nginx-upstream.conf:/etc/nginx/nginx.conf:ro
    networks: !override
      - watch-edge

  watch-gateway:
    extends:
      file: ../../compose.staging-tunnel.yml
      service: watch-gateway
    ports:
      - "127.0.0.1::8080"

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    user: "65534:65534"
    command: ["--config.file=/config/watch-probes.yml", "--history.limit=0", "--log.prober=error"]
    volumes:
      - ../blackbox/watch-probes.yml:/config/watch-probes.yml:ro
    ports:
      - "127.0.0.1::9115"
    networks:
      - watch-ingress
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9115/-/healthy"]
      interval: 1s
      timeout: 2s
      retries: 10
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    logging:
      driver: none

networks:
  watch-edge:
    internal: true
  watch-ingress:
    # 호스트 루프백의 시험 클라이언트가 임시 공개 포트로 접근하는 네트워크다.
    internal: false
