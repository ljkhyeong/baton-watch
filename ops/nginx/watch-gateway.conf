worker_processes 1;
pid /tmp/nginx.pid;
# NGINX 오류 로그는 요청 경로를 포함할 수 있어 저장하지 않는다.
error_log /dev/null;

events {
    worker_connections 256;
}

http {
    log_format watch_safe 'status=$status duration=$request_time limit=$limit_req_status';
    access_log /dev/stdout watch_safe;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 10s;
    reset_timedout_connection on;

    # 단일 연동의 경로별 전체 예산이다. 클라이언트 IP·토큰·리소스 ID를 키로 쓰지 않는다.
    limit_req_zone $server_name zone=watch_status:64k rate=10r/s;
    limit_req_zone $server_name zone=watch_monitors:64k rate=5r/s;
    limit_req_status 429;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    upstream watch_backend {
        zone watch_backend 64k;
        server watch:8080 resolve;
    }

    server {
        listen 8080;
        server_name watch-gateway;
        add_header Cache-Control no-store always;
        error_page 429 = @rate_limited;

        # 인증과 본문 크기 검사는 WATCH가 맡는다. 프록시에 본문을 저장하지 않는다.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_connect_timeout 2s;
        # 허용된 DB 연결 대기·트랜잭션 상한 각각 30초보다 여유를 둔다.
        proxy_read_timeout 65s;
        proxy_send_timeout 15s;
        proxy_next_upstream off;

        location = /api/v1/system/status {
            limit_req zone=watch_status burst=20 nodelay;
            proxy_pass http://watch_backend;
        }

        location /api/v1/ {
            limit_req zone=watch_monitors burst=10 nodelay;
            proxy_pass http://watch_backend;
        }

        location @rate_limited {
            default_type application/problem+json;
            add_header Cache-Control no-store always;
            return 429 '{"type":"urn:baton-watch:problem:rate-limited","title":"요청이 너무 많습니다","status":429,"code":"RATE_LIMITED"}';
        }

        location / {
            return 404;
        }
    }

    # 프록시 생존 확인은 컨테이너 내부에서만 접근한다. WATCH 준비 상태와 별개다.
    server {
        listen 127.0.0.1:8082;
        access_log off;
        location = /health { return 204; }
        location / { return 404; }
    }
}
