# WATCH 전용 예시다. 공용 Alertmanager에서는 기존 route·receivers·templates에 병합한다.
route:
  receiver: ignore
  routes:
    - receiver: watch-slack
      group_by: [alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      matchers:
        - 'job=~"baton-watch|baton-watch-ingress"'
        - 'alertname=~"Watch.+"'

receivers:
  - name: ignore
  - name: watch-slack
    slack_configs:
      # 채널은 Slack에서 웹훅을 발급할 때 선택한다.
      - api_url_file: /run/secrets/watch-slack-webhook-url
        send_resolved: true
        title: BATON WATCH
        title_link: https://watch.b4ton.com/api/v1/system/status
        text: '{{ template "watch.notification" . }}'
        fallback: '{{ template "watch.notification" . }}'
        mrkdwn_in: []
        http_config:
          follow_redirects: false

templates:
  - /etc/alertmanager/watch-notification.tmpl
