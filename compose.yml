services:
  postgres:
    build:
      context: .
      target: postgres
    # 두 서비스에 같은 재시작·권한 상승 차단·로그 제한을 적용한다.
    <<: &local-service
      restart: unless-stopped
      security_opt:
        - no-new-privileges:true
      logging:
        driver: json-file
        options:
          max-size: "10m"
          max-file: "3"
    environment:
      POSTGRES_DB: "${WATCH_DB_NAME:-baton_watch}"
      POSTGRES_USER: "${WATCH_DB_USER:-baton_watch}"
      POSTGRES_PASSWORD: "${WATCH_DB_PASSWORD:?WATCH_DB_PASSWORD is required}"
    volumes:
      - watch-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  watch:
    build:
      context: .
    <<: *local-service
    environment:
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8}"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${WATCH_DB_NAME:-baton_watch}"
      SPRING_DATASOURCE_USERNAME: "${WATCH_DB_USER:-baton_watch}"
      SPRING_DATASOURCE_PASSWORD: "${WATCH_DB_PASSWORD:?WATCH_DB_PASSWORD is required}"
      WATCH_API_TOKEN: "${WATCH_API_TOKEN:?WATCH_API_TOKEN is required}"
      # 환경 파일·셸 값만 전달하고, 없으면 application.yml 기본값을 사용한다.
      WATCH_CHECK_ENABLED:
      WATCH_DB_MAXIMUM_POOL_SIZE:
      WATCH_DB_MINIMUM_IDLE:
      WATCH_DB_CONNECTION_TIMEOUT_MILLIS:
      WATCH_DB_VALIDATION_TIMEOUT_MILLIS:
      WATCH_DB_IDLE_TIMEOUT_MILLIS:
      WATCH_DB_MAX_LIFETIME_MILLIS:
      WATCH_DB_KEEPALIVE_TIME_MILLIS:
      WATCH_DB_INITIALIZATION_FAIL_TIMEOUT_MILLIS:
      WATCH_DB_CONNECT_TIMEOUT_SECONDS:
      WATCH_DB_LOGIN_TIMEOUT_SECONDS:
      WATCH_DB_SOCKET_TIMEOUT_SECONDS:
      WATCH_DB_CANCEL_SIGNAL_TIMEOUT_SECONDS:
      WATCH_DB_TCP_KEEP_ALIVE:
      WATCH_PERSISTENCE_TRANSACTION_TIMEOUT:
      WATCH_PERSISTENCE_LOCK_TIMEOUT:
      WATCH_PERSISTENCE_QUERY_TIMEOUT:
      WATCH_WORKER_EXECUTION_BUDGET:
      WATCH_EVENT_DELIVERY_ENABLED:
      WATCH_EVENT_DELIVERY_ENDPOINT:
      WATCH_EVENT_DELIVERY_TOKEN:
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WATCH_HOST_BIND:-127.0.0.1}:${WATCH_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    stop_grace_period: 110s
    init: true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  watch-postgres-data:
