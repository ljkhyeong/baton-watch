plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':application')
    implementation project(':adapter-in-web')
    implementation project(':adapter-out-persistence')
    implementation project(':adapter-out-external')
    compileOnly 'org.postgresql:postgresql'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
}

tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'runtime-load', 'capacity'
    }
}

tasks.register('runtimeLoadTest', Test) {
    description = '실제 Spring Boot HTTP·Hikari·PostgreSQL·예약 작업의 부하와 복구를 확인한다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'runtime-load'
    }
    filter {
        includeTestsMatching '*BatonWatchRuntimeLoadTest'
        failOnNoMatchingTests = true
    }
    systemProperty 'watch.runtime-load.monitors',
            providers.gradleProperty('watchRuntimeLoadMonitors').getOrElse('25')
    testLogging.showStandardStreams = true
    outputs.upToDateWhen { false }
}

tasks.register('capacityTest', Test) {
    description = '운영 기본 일정과 느린 점검 혼합 조건의 처리 간격 및 보존 정리 참고값을 측정한다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'capacity' }
    filter {
        includeTestsMatching '*BatonWatchCapacityTest'
        failOnNoMatchingTests = true
    }
    systemProperty 'watch.capacity.monitors', providers.gradleProperty('watchCapacityMonitors').getOrElse('12')
    systemProperty 'watch.capacity.slow-millis', providers.gradleProperty('watchCapacitySlowMillis').getOrElse('5000')
    testLogging.showStandardStreams = true
    outputs.upToDateWhen { false }
}

jar {
    enabled = false
}

bootJar {
    archiveFileName = 'baton-watch.jar'
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
    }
}

def projectLicense = rootProject.layout.projectDirectory.file('LICENSE')
def bootArchive = tasks.named('bootJar').flatMap { it.archiveFile }

tasks.register('verifyBootJarLicense') {
    dependsOn tasks.named('bootJar')
    inputs.file(projectLicense)
    inputs.file(bootArchive)

    doLast {
        new java.util.zip.ZipFile(bootArchive.get().asFile).withCloseable { archive ->
            def licenseEntry = archive.getEntry('META-INF/LICENSE')
            if (licenseEntry == null) {
                throw new GradleException('bootJar에 META-INF/LICENSE가 없습니다.')
            }

            def packagedLicense = archive.getInputStream(licenseEntry).withCloseable { input ->
                input.readAllBytes()
            }
            if (!Arrays.equals(projectLicense.asFile.bytes, packagedLicense)) {
                throw new GradleException('bootJar의 META-INF/LICENSE가 저장소 LICENSE와 다릅니다.')
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyBootJarLicense')
}
