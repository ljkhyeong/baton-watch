spring:
  application:
    name: baton-watch
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/baton_watch}
    username: ${SPRING_DATASOURCE_USERNAME:baton_watch}
    password: ${SPRING_DATASOURCE_PASSWORD}
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 65s

logging:
  level:
    org.apache.hc.client5.http.headers: OFF
    org.apache.hc.client5.http.wire: OFF
    org.apache.hc.client5.http.impl: OFF
    org.apache.hc.client5.http.ssl: OFF

watch:
  api-token: ${WATCH_API_TOKEN}
  database:
    maximum-pool-size: ${WATCH_DB_MAXIMUM_POOL_SIZE:8}
    minimum-idle: ${WATCH_DB_MINIMUM_IDLE:2}
    connection-timeout-millis: ${WATCH_DB_CONNECTION_TIMEOUT_MILLIS:3000}
    validation-timeout-millis: ${WATCH_DB_VALIDATION_TIMEOUT_MILLIS:1000}
    idle-timeout-millis: ${WATCH_DB_IDLE_TIMEOUT_MILLIS:600000}
    max-lifetime-millis: ${WATCH_DB_MAX_LIFETIME_MILLIS:1800000}
    keepalive-time-millis: ${WATCH_DB_KEEPALIVE_TIME_MILLIS:120000}
    initialization-fail-timeout-millis: ${WATCH_DB_INITIALIZATION_FAIL_TIMEOUT_MILLIS:5000}
    connect-timeout-seconds: ${WATCH_DB_CONNECT_TIMEOUT_SECONDS:3}
    login-timeout-seconds: ${WATCH_DB_LOGIN_TIMEOUT_SECONDS:5}
    socket-timeout-seconds: ${WATCH_DB_SOCKET_TIMEOUT_SECONDS:10}
    cancel-signal-timeout-seconds: ${WATCH_DB_CANCEL_SIGNAL_TIMEOUT_SECONDS:3}
    tcp-keep-alive: ${WATCH_DB_TCP_KEEP_ALIVE:true}
  persistence:
    query-timeout: ${WATCH_PERSISTENCE_QUERY_TIMEOUT:5s}
    transaction-timeout: ${WATCH_PERSISTENCE_TRANSACTION_TIMEOUT:5s}
    lock-timeout: ${WATCH_PERSISTENCE_LOCK_TIMEOUT:1s}
  poll-interval: 1s
  maintenance-interval: 1m
  lease-duration: 30s
  check-interval: 60s
  internal-failure-retry-interval: 30s
  stale-after: 10m
  retention: 30d
  check-batch-size: 1
  maintenance-batch-size: 100
  http:
    connect-timeout: 2s
    response-timeout: 3s
    total-timeout: 5s
    max-response-bytes: 65536
    max-redirects: 3
    max-header-count: 100
    max-header-line-length: 8192
    dns-threads: 2
    dns-queue-capacity: 8
    request-threads: 1
    request-queue-capacity: 1
  event-delivery:
    enabled: ${WATCH_EVENT_DELIVERY_ENABLED:false}
    endpoint: ${WATCH_EVENT_DELIVERY_ENDPOINT:}
    bearer-token: ${WATCH_EVENT_DELIVERY_TOKEN:}
    poll-interval: 1s
    maintenance-interval: 1m
    lease-duration: 60s
    initial-retry-delay: 5s
    max-retry-delay: 15m
    retention: 30d
    batch-size: 10
    maintenance-batch-size: 100
    http:
      connect-timeout: 2s
      response-timeout: 3s
      total-timeout: 5s
      max-response-bytes: 8192
      max-header-count: 100
      max-header-line-length: 8192
      dns-threads: 2
      dns-queue-capacity: 8
      request-threads: 1
      request-queue-capacity: 1

management:
  server:
    port: 8081
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,prometheus
