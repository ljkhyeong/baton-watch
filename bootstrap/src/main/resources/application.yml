spring:
  application:
    name: baton-watch
  jackson:
    read:
      strict-duplicate-detection: true
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
    datatype:
      enum:
        fail-on-numbers-for-enums: true
  datasource:
    url: jdbc:postgresql://localhost:5432/baton_watch
    username: baton_watch
watch:
  # 속성 경로와 환경 변수 이름이 달라 자리표시자로 연결한다.
  database:
    maximum-pool-size: ${WATCH_DB_MAXIMUM_POOL_SIZE:8}
    minimum-idle: ${WATCH_DB_MINIMUM_IDLE:2}
    connection-timeout-millis: ${WATCH_DB_CONNECTION_TIMEOUT_MILLIS:3000}
    validation-timeout-millis: ${WATCH_DB_VALIDATION_TIMEOUT_MILLIS:1000}
    idle-timeout-millis: ${WATCH_DB_IDLE_TIMEOUT_MILLIS:600000}
    max-lifetime-millis: ${WATCH_DB_MAX_LIFETIME_MILLIS:1800000}
    keepalive-time-millis: ${WATCH_DB_KEEPALIVE_TIME_MILLIS:120000}
    initialization-fail-timeout-millis: ${WATCH_DB_INITIALIZATION_FAIL_TIMEOUT_MILLIS:5000}
    connect-timeout-seconds: ${WATCH_DB_CONNECT_TIMEOUT_SECONDS:3}
    login-timeout-seconds: ${WATCH_DB_LOGIN_TIMEOUT_SECONDS:5}
    socket-timeout-seconds: ${WATCH_DB_SOCKET_TIMEOUT_SECONDS:10}
    cancel-signal-timeout-seconds: ${WATCH_DB_CANCEL_SIGNAL_TIMEOUT_SECONDS:3}
    tcp-keep-alive: ${WATCH_DB_TCP_KEEP_ALIVE:true}
  persistence:
    query-timeout: 5s
    transaction-timeout: 5s
    lock-timeout: 1s
  poll-interval: 1s
  maintenance-interval: 1m
  worker-execution-budget: 60s
  lease-duration: 30s
  check-interval: 60s
  internal-failure-retry-interval: 30s
  stale-after: 10m
  retention: 30d
  check-batch-size: 1
  maintenance-batch-size: 100
  http:
    connect-timeout: 2s
    response-timeout: 3s
    total-timeout: 5s
    max-header-count: 100
    max-header-line-length: 8192
    dns-threads: 2
    dns-queue-capacity: 8
    request-threads: 1
    request-queue-capacity: 1
  event-delivery:
    endpoint: ""
    # 속성 경로와 환경 변수 이름이 달라 자리표시자로 연결한다.
    bearer-token: ${WATCH_EVENT_DELIVERY_TOKEN:}
    poll-interval: 1s
    lease-duration: 60s
    initial-retry-delay: 5s
    max-retry-delay: 15m
    retention: 30d
    batch-size: 2
    http:
      connect-timeout: 2s
      response-timeout: 3s
      total-timeout: 5s
      max-response-bytes: 8192
      max-header-count: 100
      max-header-line-length: 8192
      dns-threads: 2
      dns-queue-capacity: 8
      request-threads: 1
      request-queue-capacity: 1

management:
  server:
    port: 8081
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
